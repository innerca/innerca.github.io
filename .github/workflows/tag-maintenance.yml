name: Monthly Tag Maintenance

on:
  schedule:
    # First Monday of each month at 07:00 UTC
    - cron: '0 7 1-7 * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tag-maintenance:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # ── Node.js for Astro ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ── Python for Groq ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install groq

      # ── Data pipeline + tag maintenance ──
      - run: npm run fetch

      - name: Summarize with Groq AI
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python scripts/summarize.py

      - name: AI Tag Review
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python scripts/manage_tags.py

      # ── Commit tag changes ──
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: monthly AI tag maintenance"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: tag-maintenance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
