name: Daily Update & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # ── Node.js for Astro ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ── Python for Groq summarizer ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install groq

      # ── Data pipeline ──
      - run: npm run fetch

      - name: Summarize with Groq AI
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python scripts/summarize.py

      - name: Pull HF Daily Papers signals
        run: python scripts/pull_hf_signals.py

      - name: Compute heat scores
        run: |
          python scripts/compute_heat_scores.py
          python scripts/export_heat_json.py

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
