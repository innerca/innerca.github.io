name: Daily Update & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # ── Node.js for Astro ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ── Python for Groq summarizer ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install groq

      # ── Data pipeline ──
      - name: Fetch papers from arXiv
        if: ${{ github.event_name != 'push' }}
        run: npm run fetch

      - name: Summarize with Groq AI
        if: ${{ github.event_name != 'push' && env.GROQ_API_KEY != '' }}
        run: python scripts/summarize.py

      - name: Pull citation signals
        if: ${{ github.event_name != 'push' }}
        run: python scripts/pull_citation_signals.py

      - name: Pull HF Daily Papers signals
        if: ${{ github.event_name != 'push' }}
        run: python scripts/pull_hf_signals.py

      - name: Compute heat scores
        if: ${{ github.event_name != 'push' }}
        run: |
          python scripts/compute_heat_scores.py
          python scripts/export_heat_json.py

      - name: Refresh derived stats
        if: ${{ github.event_name != 'push' }}
        run: npm run prebuild

      - name: Commit refreshed data
        if: ${{ github.event_name != 'push' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data refresh [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          file_pattern: src/data/**

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
